name: Perf matrix (fork only)

# Temporary: runs the expanded benchmark suite for open branches against the
# upstream main they branched from. Not for upstream.
on:
  push:
    branches: [perf-matrix-run]

permissions:
  contents: read

jobs:
  compare:
    name: ${{ matrix.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        branch: [perf/cache-literal-getters, tmp/lit-diag-writer-base]
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          path: head
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Base
        working-directory: head
        run: |
          git fetch -q https://github.com/rdfjs/N3.js main:upstream-main
          base=$(git merge-base HEAD upstream-main)
          git worktree add ../base "$base"
          echo "Comparing $(git rev-parse --short HEAD) with merge base $(git rev-parse --short $base)"
      - name: Build
        run: |
          (cd tools && npm ci --ignore-scripts)
          (cd head && npm ci --ignore-scripts && npx babel src -d lib)
          (cd base && npm ci --ignore-scripts && npx babel src -d lib)
      - name: Compare
        working-directory: tools
        run: node perf/ci/compare.js --base ../base/lib --head ../head/lib --json ../results.json
